<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>Travel Companion</title>
  <style>
    :root{
      --bg:#07101d;--panel:#101c2d;--panel2:#162438;--text:#f5f8fb;--muted:#93a4b8;
      --line:rgba(255,255,255,.10);--accent:#73e0ca;--accentText:#06231e;--good:#75e19a;
      --warn:#ffcb6b;--danger:#ff8b85;--shadow:0 18px 52px rgba(0,0,0,.24);
      --r:22px;--safe-bottom:max(12px,env(safe-area-inset-bottom));
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
    body{padding:0 0 calc(86px + var(--safe-bottom))}
    button,a{font:inherit;-webkit-tap-highlight-color:transparent}
    button{color:inherit}
    .app{width:min(100%,560px);margin:0 auto;min-height:100vh}
    .topbar{position:sticky;top:0;z-index:20;padding:max(12px,env(safe-area-inset-top)) 16px 9px;background:linear-gradient(180deg,var(--bg) 78%,transparent)}
    .toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-weight:800;letter-spacing:-.02em}
    .clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
    .daytabs{display:flex;gap:8px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}
    .daytabs::-webkit-scrollbar{display:none}
    .daytab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:9px 13px;font-size:.84rem}
    .daytab.active{background:var(--accent);color:var(--accentText);border-color:transparent;font-weight:800}
    .view{display:none;padding:4px 15px 22px}
    .view.active{display:block}
    .hero{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:30px;padding:21px;box-shadow:var(--shadow)}
    .hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-72px;top:-90px;background:radial-gradient(circle,rgba(115,224,202,.24),transparent 68%);pointer-events:none}
    .kicker{font-size:.76rem;color:var(--accent);font-weight:850;letter-spacing:.12em;text-transform:uppercase}
    .city{font-size:clamp(2rem,9vw,3.35rem);font-weight:850;letter-spacing:-.055em;line-height:1.02;margin:7px 0 5px}
    .route{color:var(--muted);font-size:.9rem}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:17px}
    .metric{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:16px;padding:11px}
    .metric b{display:block;font-size:1rem;font-variant-numeric:tabular-nums}
    .metric span{display:block;color:var(--muted);font-size:.69rem;margin-top:2px}
    .section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:20px 2px 10px}
    .section-title h2{font-size:1.02rem;margin:0}
    .section-title span{font-size:.75rem;color:var(--muted);text-align:right}
    .nextcard,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
    .nexthead{display:flex;align-items:flex-start;gap:13px}
    .bigicon{width:52px;height:52px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:17px;font-size:1.55rem;flex:0 0 auto}
    .nextcopy{min-width:0;flex:1}
    .timebadge{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:.81rem;font-weight:850}
    .nextcopy h1{font-size:1.35rem;line-height:1.2;letter-spacing:-.035em;margin:6px 0 4px}
    .local{color:var(--muted);font-size:.8rem;line-height:1.4}
    .detail{color:var(--muted);font-size:.89rem;margin:13px 0 0;line-height:1.55}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
    .chip{padding:5px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:.7rem}
    .chip.hard{color:var(--warn);border-color:rgba(255,203,107,.28)}
    .countdown{margin-top:13px;padding:11px 13px;background:var(--panel2);border:1px solid var(--line);border-radius:15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .countdown strong{font-size:1.01rem;font-variant-numeric:tabular-nums}
    .countdown span{color:var(--muted);font-size:.75rem}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
    .action{min-height:48px;border:1px solid var(--line);border-radius:15px;background:var(--panel2);color:var(--text);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:750;font-size:.88rem;padding:9px 11px}
    .action.primary{background:var(--accent);border-color:transparent;color:var(--accentText)}
    .action.full{grid-column:1/-1}
    .helper{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
    .smallbtn{min-height:41px;border:1px solid var(--line);background:transparent;border-radius:13px;color:var(--muted);font-size:.79rem;padding:7px}
    .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .quick button{min-height:58px;border:1px solid var(--line);background:var(--panel);border-radius:16px;color:var(--text);font-size:.82rem}
    .notice{display:none;margin-top:10px;padding:14px 15px;border-radius:17px;border:1px solid rgba(255,203,107,.25);background:rgba(255,203,107,.09);line-height:1.5;font-size:.86rem}
    .notice.show{display:block}
    .notice b{color:var(--warn)}
    .gate-list,.timeline,.guide-list,.trip-list,.booking-list,.tool-list{display:grid;gap:9px}
    .gate{background:var(--panel);border:1px solid rgba(255,203,107,.23);border-radius:18px;padding:13px;display:grid;grid-template-columns:58px 1fr;gap:10px}
    .gate time{color:var(--warn);font-weight:850;font-size:.84rem}
    .gate h3,.tool-card h3{margin:0 0 4px;font-size:.9rem}
    .gate p,.tool-card p{margin:0;color:var(--muted);font-size:.77rem;line-height:1.45}
    .event{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:13px;display:grid;grid-template-columns:50px 1fr auto;gap:11px;align-items:start}
    .event.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
    .event.done{opacity:.58}
    .event.skipped{opacity:.47}
    .eventtime{font-variant-numeric:tabular-nums;color:var(--accent);font-size:.79rem;font-weight:850;padding-top:3px}
    .eventbody h3{font-size:.93rem;margin:0 0 3px;line-height:1.3}
    .eventbody p{font-size:.76rem;color:var(--muted);margin:0;line-height:1.45}
    .eventstate{width:31px;height:31px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;color:var(--muted)}
    .event.done .eventstate{background:var(--good);color:#063715;border-color:transparent}
    .event.skipped .eventstate{background:var(--warn);color:#4b2e00;border-color:transparent}
    .eventdetails{grid-column:1/-1;display:none;border-top:1px solid var(--line);padding-top:11px;margin-top:1px}
    .event.open .eventdetails{display:block}
    .mini-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
    .mini{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:7px 10px;text-decoration:none;font-size:.75rem}
    .guide-preview,.booking,.trip-day,.tool-card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:14px}
    .guide-preview{display:grid;grid-template-columns:45px 1fr auto;gap:11px;align-items:center}
    .guide-preview .gicon{width:45px;height:45px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;font-size:1.25rem}
    .guide-preview h3,.booking h3,.trip-day h3{margin:0;font-size:.93rem}
    .guide-preview p,.booking p,.trip-day p{margin:4px 0 0;color:var(--muted);font-size:.75rem;line-height:1.4}
    .guide-preview button{width:37px;height:37px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--accent)}
    .booking{display:grid;grid-template-columns:39px 1fr auto;gap:10px;align-items:center}
    .booking-icon{width:39px;height:39px;border-radius:13px;background:var(--panel2);display:grid;place-items:center}
    .booking-time{text-align:right;color:var(--accent);font-size:.75rem;font-weight:800}
    .trip-day-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .trip-day-head button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:7px 10px}
    .trip-events{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
    .trip-day.open .trip-events{display:block}
    .trip-row{display:grid;grid-template-columns:48px 1fr;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}
    .trip-row:last-child{border-bottom:0}
    .trip-row time{color:var(--accent);font-size:.76rem;font-weight:800}
    .trip-row h4{margin:0;font-size:.85rem}
    .trip-row p{margin:3px 0 0;color:var(--muted);font-size:.73rem;line-height:1.4}
    .tool-card ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:.82rem;line-height:1.55}
    .phrase{margin-top:10px;padding:11px;border-radius:13px;background:var(--panel2);border:1px solid var(--line)}
    .phrase b{display:block;font-size:.76rem;color:var(--accent)}
    .phrase strong{display:block;font-size:1.05rem;margin-top:5px}
    .phrase span{display:block;color:var(--muted);font-size:.76rem;margin-top:3px}
    .empty{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:22px;text-align:center;color:var(--muted)}
    .bottomnav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,560px);padding:7px 10px var(--safe-bottom);background:linear-gradient(180deg,transparent,var(--bg) 18%);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
    .navbtn{border:0;background:transparent;color:var(--muted);min-height:56px;border-radius:15px;display:grid;place-items:center;align-content:center;gap:2px;font-size:1rem}
    .navbtn span{font-size:.63rem}
    .navbtn.active{background:var(--panel);color:var(--accent)}
    .modal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom));background:rgba(1,5,10,.82);backdrop-filter:blur(10px)}
    .modal.show{display:flex}
    #driverModal{z-index:100}
    .sheet{position:relative;width:min(100%,540px);max-height:94vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:29px;padding:20px 18px 27px;box-shadow:0 30px 100px rgba(0,0,0,.55)}
    .close{position:absolute;top:13px;right:13px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:1.2rem}
    .driver-sheet{min-height:min(63vh,560px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:52px 22px 34px}
    .driver-local{font-size:clamp(2.25rem,12vw,4.5rem);font-weight:880;letter-spacing:-.045em;line-height:1.2;overflow-wrap:anywhere}
    .driver-romanized{margin-top:20px;color:var(--muted);font-size:clamp(1.05rem,5vw,1.5rem);font-weight:650;line-height:1.4}
    .guide-tag{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--accent);color:var(--accentText);font-size:.7rem;font-weight:850}
    .guide-title{font-size:1.58rem;line-height:1.12;letter-spacing:-.04em;margin:10px 48px 5px 0}
    .guide-summary{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;line-height:1.55;color:var(--muted)}
    .guide-section{margin-top:16px}
    .guide-section h3{margin:0 0 7px;font-size:.92rem}
    .guide-section ul,.guide-section ol{margin:0;padding-left:20px;color:var(--muted);font-size:.84rem;line-height:1.58}
    .guide-sources{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
    .guide-sources a{color:var(--accent);border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:7px 9px;font-size:.72rem;text-decoration:none}
    .toast{position:fixed;z-index:110;left:50%;bottom:calc(91px + var(--safe-bottom));transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#05080d;color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:9px 13px;font-size:.79rem;transition:.2s;white-space:nowrap;max-width:calc(100% - 34px);overflow:hidden;text-overflow:ellipsis}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .action:active,.daytab:active,.navbtn:active,.smallbtn:active,.mini:active{transform:scale(.98)}
    @media(min-width:700px){body{padding-top:18px}.app{border:1px solid var(--line);border-radius:34px 34px 0 0;overflow:hidden}.bottomnav{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
  </style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="toprow"><div class="brand" id="brand">Travel Companion</div><div class="clock" id="clock">--:--</div></div>
    <div class="daytabs" id="dayTabs" aria-label="选择日期"></div>
  </header>

  <main>
    <section class="view active" id="homeView" data-view="home">
      <div class="hero">
        <div class="kicker" id="heroDate">Today</div>
        <div class="city" id="heroCity">Destination</div>
        <div class="route" id="heroRoute"></div>
        <div class="metrics" id="heroMetrics"></div>
      </div>
      <div class="section-title"><h2>下一步</h2><span id="nextStatus">按当前时间定位</span></div>
      <article class="nextcard" id="nextCard"></article>
      <div class="section-title"><h2>现在感觉怎样？</h2><span>只给降级建议，不改原计划</span></div>
      <div class="quick">
        <button type="button" data-adjust="hot">🥵<br>太热了</button>
        <button type="button" data-adjust="tired">😮‍💨<br>有点累</button>
        <button type="button" data-adjust="rain">☔<br>下雨了</button>
      </div>
      <div class="notice" id="adjustNotice"></div>
      <div class="section-title"><h2>今天的硬性时间</h2><span>优先保护这些节点</span></div>
      <div class="gate-list" id="gateList"></div>
    </section>

    <section class="view" id="timelineView" data-view="timeline">
      <div class="section-title"><h2>当天时间轴</h2><span>点卡片展开操作</span></div>
      <div class="timeline" id="timeline"></div>
    </section>

    <section class="view" id="guidesView" data-view="guides">
      <div class="section-title"><h2>目的地攻略</h2><span>到现场再看重点</span></div>
      <div class="guide-list" id="guideList"></div>
    </section>

    <section class="view" id="tripView" data-view="trip">
      <div class="section-title"><h2>完整行程</h2><span id="tripChecked"></span></div>
      <div class="trip-list" id="tripList"></div>
      <div class="section-title"><h2>预约与硬性时间</h2><span>全集中在这里</span></div>
      <div class="booking-list" id="bookingList"></div>
    </section>

    <section class="view" id="moreView" data-view="more">
      <div class="section-title"><h2>随行工具</h2><span>离线可查看</span></div>
      <div class="tool-list" id="toolList"></div>
    </section>
  </main>

  <nav class="bottomnav" aria-label="主导航">
    <button class="navbtn active" data-nav="home" type="button">⌂<span>下一步</span></button>
    <button class="navbtn" data-nav="timeline" type="button">≡<span>今天</span></button>
    <button class="navbtn" data-nav="guides" type="button">◎<span>攻略</span></button>
    <button class="navbtn" data-nav="trip" type="button">▤<span>总行程</span></button>
    <button class="navbtn" data-nav="more" type="button">•••<span>更多</span></button>
  </nav>
</div>

<div class="modal" id="driverModal" role="dialog" aria-modal="true" aria-label="给司机看">
  <div class="sheet driver-sheet">
    <button class="close" data-close="driverModal" type="button" aria-label="关闭">×</button>
    <div class="driver-local" id="driverLocal"></div>
    <div class="driver-romanized" id="driverRomanized"></div>
    <div class="detail">请将此页面给司机或工作人员看</div>
  </div>
</div>

<div class="modal" id="guideModal" role="dialog" aria-modal="true" aria-label="目的地攻略">
  <div class="sheet">
    <button class="close" data-close="guideModal" type="button" aria-label="关闭">×</button>
    <span class="guide-tag" id="guideTag">攻略</span>
    <h2 class="guide-title" id="guideTitle"></h2>
    <div class="local" id="guideLocal"></div>
    <div class="guide-summary" id="guideSummary"></div>
    <div id="guideSections"></div>
    <div class="actions" id="guideActions"></div>
  </div>
</div>

<div class="toast" id="toast" aria-live="polite"></div>

<script src="./companion-data.js"></script>
<script>
(() => {
  "use strict";
  const DATA = globalThis.TRAVEL_COMPANION;
  if (!DATA || !Array.isArray(DATA.days) || !DATA.days.length) {
    document.getElementById("app").innerHTML = '<div class="empty" style="margin:24px">Companion data is missing.</div>';
    return;
  }

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
  const esc = (value = "") => String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  })[char]);
  const array = value => Array.isArray(value) ? value : [];
  const byId = id => DATA.days.flatMap(day => day.events).find(event => event.id === id);
  const dayForEvent = id => DATA.days.find(day => day.events.some(event => event.id === id));
  const timeMinutes = value => {
    const match = /^(\d{2}):(\d{2})$/.exec(value || "");
    return match ? Number(match[1]) * 60 + Number(match[2]) : 0;
  };
  const dateParts = () => {
    try {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: DATA.meta.timezone, year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hourCycle: "h23"
      }).formatToParts(new Date());
      return Object.fromEntries(parts.map(part => [part.type, part.value]));
    } catch {
      const now = new Date();
      return {
        year: String(now.getFullYear()), month: String(now.getMonth() + 1).padStart(2, "0"),
        day: String(now.getDate()).padStart(2, "0"), hour: String(now.getHours()).padStart(2, "0"),
        minute: String(now.getMinutes()).padStart(2, "0")
      };
    }
  };
  const nowInfo = () => {
    const parts = dateParts();
    return {
      date: `${parts.year}-${parts.month}-${parts.day}`,
      minutes: Number(parts.hour) * 60 + Number(parts.minute),
      label: `${parts.hour}:${parts.minute}`
    };
  };

  const memory = new Map();
  const storage = {
    get(key) {
      try { return localStorage.getItem(key); } catch { return memory.get(key) || null; }
    },
    set(key, value) {
      try { localStorage.setItem(key, value); } catch { memory.set(key, value); }
    }
  };
  const stateKey = `${DATA.meta.storageKey}.state`;
  const initialState = { days: {}, history: [] };
  let state;
  try { state = JSON.parse(storage.get(stateKey)) || initialState; } catch { state = initialState; }
  if (!state.days) state.days = {};
  if (!Array.isArray(state.history)) state.history = [];
  const save = () => storage.set(stateKey, JSON.stringify(state));
  const progress = dayId => {
    if (!state.days[dayId]) state.days[dayId] = { done: [], skipped: [], current: "" };
    return state.days[dayId];
  };
  const snapshot = () => {
    state.history.push(JSON.stringify(state.days));
    state.history = state.history.slice(-20);
  };

  const params = new URLSearchParams(location.search);
  const currentDate = nowInfo().date;
  let selectedDayId = params.get("day") || DATA.days.find(day => day.date === currentDate)?.id || DATA.days[0].id;
  if (!DATA.days.some(day => day.id === selectedDayId)) selectedDayId = DATA.days[0].id;
  let openEventId = "";
  let currentView = "home";
  let toastTimer;

  const day = () => DATA.days.find(item => item.id === selectedDayId) || DATA.days[0];
  const activeEvent = () => {
    const selected = day();
    const p = progress(selected.id);
    const manual = selected.events.find(event => event.id === p.current);
    if (manual && !p.done.includes(manual.id) && !p.skipped.includes(manual.id)) return manual;
    const remaining = selected.events.filter(event => !p.done.includes(event.id) && !p.skipped.includes(event.id));
    if (!remaining.length) return selected.events[selected.events.length - 1];
    const now = nowInfo();
    if (selected.date !== now.date) return remaining[0];
    return remaining.find(event => timeMinutes(event.end || event.time) >= now.minutes) || remaining[remaining.length - 1];
  };
  const nextRemaining = event => {
    const selected = day();
    const p = progress(selected.id);
    const index = selected.events.findIndex(item => item.id === event.id);
    return selected.events.slice(index + 1).find(item => !p.done.includes(item.id) && !p.skipped.includes(item.id));
  };
  const toast = message => {
    const node = $("#toast");
    node.textContent = message;
    node.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => node.classList.remove("show"), 1800);
  };
  const googleUrl = item => item?.maps?.google || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item?.destination || item?.localName || item?.title || "")}`;
  const hasGuide = event => event.guide && (event.guide.summary || array(event.guide.do).length || array(event.guide.tips).length);
  const mapActions = event => {
    const links = [];
    if (googleUrl(event)) links.push(`<a class="action primary" href="${esc(googleUrl(event))}" target="_blank" rel="noopener">🧭 Google Maps</a>`);
    if (event.maps?.official) links.push(`<a class="action" href="${esc(event.maps.official)}" target="_blank" rel="noopener">官方信息</a>`);
    if (event.maps?.uber) links.push(`<a class="action" href="${esc(event.maps.uber)}" target="_blank" rel="noopener">叫车</a>`);
    return links.join("");
  };

  function renderTabs() {
    $("#brand").textContent = DATA.meta.title;
    $("#dayTabs").innerHTML = DATA.days.map(item =>
      `<button class="daytab ${item.id === selectedDayId ? "active" : ""}" data-day="${esc(item.id)}" type="button">${esc(item.dateLabel)} · ${esc(item.city)}</button>`
    ).join("");
    $$("[data-day]").forEach(button => button.addEventListener("click", () => {
      selectedDayId = button.dataset.day;
      openEventId = "";
      renderAll();
    }));
  }

  function countdownLabel(event) {
    const selected = day();
    const now = nowInfo();
    if (selected.date !== now.date) return { strong: event.hardGate ? event.latest : event.time, small: "按行程顺序执行" };
    const diff = timeMinutes(event.time) - now.minutes;
    if (diff > 60) return { strong: `${Math.floor(diff / 60)}小时${diff % 60}分钟`, small: "距离开始" };
    if (diff > 0) return { strong: `${diff}分钟`, small: "距离开始" };
    const endDiff = timeMinutes(event.end || event.time) - now.minutes;
    if (endDiff >= 0) return { strong: "正在进行", small: event.hardGate ? event.latest : "按计划推进" };
    return { strong: "计划时间已过", small: "按现场情况继续" };
  }

  function renderHome() {
    const selected = day();
    const event = activeEvent();
    const p = progress(selected.id);
    const hardCount = selected.events.filter(item => item.hardGate).length + array(selected.hardGates).length;
    $("#heroDate").textContent = selected.dateLabel;
    $("#heroCity").textContent = selected.city;
    $("#heroRoute").textContent = selected.route;
    $("#heroMetrics").innerHTML = [
      [selected.events.length, "当天步骤"],
      [hardCount, "硬性节点"],
      [selected.sunset || "—", "日落"]
    ].map(([value, label]) => `<div class="metric"><b>${esc(value)}</b><span>${esc(label)}</span></div>`).join("");
    const count = countdownLabel(event);
    const chips = [
      event.hardGate ? "硬性时间" : "",
      ...array(event.physical).slice(0, 3)
    ].filter(Boolean);
    $("#nextStatus").textContent = selected.date === nowInfo().date ? "按当前时间定位" : "按行程顺序显示";
    $("#nextCard").innerHTML = `
      <div class="nexthead">
        <div class="bigicon">${esc(event.icon || "🧭")}</div>
        <div class="nextcopy">
          <div class="timebadge">${esc(event.time)}${event.end ? `–${esc(event.end)}` : ""}</div>
          <h1>${esc(event.title)}</h1>
          <div class="local">${esc(event.localName || "")}${event.romanized ? ` · ${esc(event.romanized)}` : ""}</div>
        </div>
      </div>
      <p class="detail">${esc(event.detail)}</p>
      ${chips.length ? `<div class="chips">${chips.map((chip, index) => `<span class="chip ${index === 0 && event.hardGate ? "hard" : ""}">${esc(chip)}</span>`).join("")}</div>` : ""}
      ${event.hardGate ? `<div class="notice show"><b>${esc(event.latest)}</b><br>${esc(event.consequence)}<br>后备：${esc(event.fallback)}</div>` : ""}
      <div class="countdown"><strong>${esc(count.strong)}</strong><span>${esc(count.small)}</span></div>
      <div class="actions">${mapActions(event)}</div>
      <div class="helper">
        <button class="smallbtn" data-complete="${esc(event.id)}" type="button">✓ 完成并前进</button>
        <button class="smallbtn" data-guide="${esc(event.id)}" type="button" ${hasGuide(event) ? "" : "disabled"}>查看攻略</button>
        <button class="smallbtn" data-driver="${esc(event.id)}" type="button">给司机看</button>
      </div>`;
    bindEventActions($("#nextCard"));
    $("#gateList").innerHTML = [
      ...array(selected.hardGates).map(gate => ({
        time: gate.time, title: gate.label, detail: `${gate.leaveBy ? `最晚出发 ${gate.leaveBy}。` : ""}${gate.fallback || ""}`
      })),
      ...selected.events.filter(item => item.hardGate).map(item => ({
        time: item.time, title: item.title, detail: `${item.latest}；后备：${item.fallback}`
      }))
    ].map(gate => `<article class="gate"><time>${esc(gate.time)}</time><div><h3>${esc(gate.title)}</h3><p>${esc(gate.detail)}</p></div></article>`).join("") || '<div class="empty">今天没有额外硬性节点</div>';
  }

  function branchHtml(event) {
    if (!array(event.branches).length) return "";
    return `<div class="guide-section"><h3>分线目的地</h3>${event.branches.map((branch, index) => `
      <div class="phrase">
        <b>${esc(branch.label)}</b><strong>${esc(branch.title)}</strong>
        <span>${esc(branch.localName || "")}${branch.romanized ? ` · ${esc(branch.romanized)}` : ""}</span>
        <div class="mini-actions">
          <button class="mini" data-branch-driver="${esc(event.id)}" data-branch-index="${index}" type="button">大字卡</button>
          <a class="mini" href="${esc(googleUrl(branch))}" target="_blank" rel="noopener">地图</a>
        </div>
      </div>`).join("")}</div>`;
  }

  function renderTimeline() {
    const selected = day();
    const p = progress(selected.id);
    const active = activeEvent();
    $("#timeline").innerHTML = selected.events.map(event => {
      const done = p.done.includes(event.id);
      const skipped = p.skipped.includes(event.id);
      const open = openEventId === event.id;
      return `<article class="event ${event.id === active.id ? "active" : ""} ${done ? "done" : ""} ${skipped ? "skipped" : ""} ${open ? "open" : ""}">
        <div class="eventtime">${esc(event.time)}</div>
        <div class="eventbody"><h3>${esc(event.icon || "•")} ${esc(event.title)}</h3><p>${esc(event.localName || "")} · ${esc(event.duration || "")}</p></div>
        <button class="eventstate" data-toggle="${esc(event.id)}" type="button">${done ? "✓" : skipped ? "–" : "›"}</button>
        <div class="eventdetails">
          <p class="detail" style="margin:0">${esc(event.detail)}</p>
          ${event.hardGate ? `<div class="notice show"><b>${esc(event.latest)}</b><br>${esc(event.consequence)}<br>后备：${esc(event.fallback)}</div>` : ""}
          ${branchHtml(event)}
          <div class="mini-actions">
            <button class="mini" data-current="${esc(event.id)}" type="button">从这里继续</button>
            <button class="mini" data-mark="${esc(event.id)}" type="button">${done ? "取消完成" : "标记完成"}</button>
            <button class="mini" data-skip="${esc(event.id)}" type="button">${skipped ? "取消跳过" : "跳过"}</button>
            <button class="mini" data-guide="${esc(event.id)}" type="button" ${hasGuide(event) ? "" : "disabled"}>攻略</button>
            <button class="mini" data-driver="${esc(event.id)}" type="button">司机卡</button>
            <a class="mini" href="${esc(googleUrl(event))}" target="_blank" rel="noopener">地图</a>
          </div>
        </div>
      </article>`;
    }).join("");
    $$("[data-toggle]", $("#timeline")).forEach(button => button.addEventListener("click", () => {
      openEventId = openEventId === button.dataset.toggle ? "" : button.dataset.toggle;
      renderTimeline();
    }));
    bindEventActions($("#timeline"));
  }

  function renderGuides() {
    const events = day().events.filter(hasGuide);
    $("#guideList").innerHTML = events.map(event => `
      <article class="guide-preview">
        <div class="gicon">${esc(event.icon || "◎")}</div>
        <div><h3>${esc(event.title)}</h3><p>${esc(event.guide.summary || event.detail)}</p></div>
        <button data-guide="${esc(event.id)}" type="button" aria-label="打开攻略">›</button>
      </article>`).join("") || '<div class="empty">这一天没有额外攻略</div>';
    bindEventActions($("#guideList"));
  }

  function renderTrip() {
    $("#tripChecked").textContent = `核对于 ${DATA.meta.checkedOn}`;
    $("#tripList").innerHTML = DATA.days.map((item, index) => `
      <article class="trip-day ${item.id === selectedDayId || index === 0 ? "open" : ""}">
        <div class="trip-day-head">
          <div><h3>${esc(item.dateLabel)} · ${esc(item.city)}</h3><p>${esc(item.route)}</p></div>
          <button data-trip-toggle="${esc(item.id)}" type="button">展开/收起</button>
        </div>
        <div class="trip-events">${item.events.map(event => `
          <div class="trip-row">
            <time>${esc(event.time)}</time>
            <div><h4>${esc(event.icon || "•")} ${esc(event.title)}</h4><p>${esc(event.localName || "")} · ${esc(event.detail)}</p>
              <div class="mini-actions">
                <button class="mini" data-trip-current="${esc(event.id)}" type="button">从这里继续</button>
                <button class="mini" data-driver="${esc(event.id)}" type="button">司机卡</button>
                <a class="mini" href="${esc(googleUrl(event))}" target="_blank" rel="noopener">地图</a>
              </div>
            </div>
          </div>`).join("")}</div>
      </article>`).join("");
    $("#bookingList").innerHTML = array(DATA.bookings).map(booking => `
      <article class="booking">
        <div class="booking-icon">${esc(booking.icon || "📌")}</div>
        <div><h3>${esc(booking.title)}</h3><p>${esc(booking.localName || "")} · ${esc(booking.detail || "")}</p></div>
        <div class="booking-time">${esc(booking.date)}<br>${esc(booking.time)}</div>
      </article>`).join("") || '<div class="empty">没有单独列出的预约</div>';
    $$("[data-trip-toggle]", $("#tripList")).forEach(button => button.addEventListener("click", () => {
      button.closest(".trip-day").classList.toggle("open");
    }));
    $$("[data-trip-current]", $("#tripList")).forEach(button => button.addEventListener("click", () => {
      selectedDayId = dayForEvent(button.dataset.tripCurrent).id;
      setCurrent(button.dataset.tripCurrent);
    }));
    bindEventActions($("#tripView"));
  }

  function renderMore() {
    const toolkit = DATA.toolkit || {};
    const emergency = array(toolkit.emergency);
    const phrases = array(toolkit.phrases);
    const notes = array(toolkit.notes);
    $("#toolList").innerHTML = `
      <article class="tool-card"><h3>⚠️ 应急顺序</h3><ul>${emergency.map(item => `<li>${esc(item)}</li>`).join("")}</ul></article>
      <article class="tool-card"><h3>💬 常用语</h3>${phrases.map(phrase => `
        <div class="phrase"><b>${esc(phrase.label)}</b><strong>${esc(phrase.local)}</strong><span>${esc(phrase.romanized || "")}</span></div>`).join("") || "<p>没有额外常用语</p>"}</article>
      <article class="tool-card"><h3>📱 离线与进度</h3><ul>${notes.map(item => `<li>${esc(item)}</li>`).join("")}</ul>
        <div class="mini-actions"><button class="mini" id="undoBtn" type="button">撤销上一步</button><button class="mini" id="resetBtn" type="button">重置当天</button></div>
      </article>
      <article class="tool-card"><h3>ℹ️ 版本信息</h3><p>${esc(DATA.meta.footer || "")}<br>核对日期：${esc(DATA.meta.checkedOn)}</p></article>`;
    $("#undoBtn").addEventListener("click", undo);
    $("#resetBtn").addEventListener("click", resetDay);
  }

  function showView(view) {
    currentView = view;
    $$(".view").forEach(node => node.classList.toggle("active", node.dataset.view === view));
    $$("[data-nav]").forEach(button => button.classList.toggle("active", button.dataset.nav === view));
    if (view === "timeline") renderTimeline();
    if (view === "guides") renderGuides();
    if (view === "trip") renderTrip();
    if (view === "more") renderMore();
    scrollTo({ top: 0, behavior: "smooth" });
  }

  function setCurrent(eventId) {
    const selected = dayForEvent(eventId);
    if (!selected) return;
    snapshot();
    selectedDayId = selected.id;
    progress(selected.id).current = eventId;
    save();
    renderAll();
    showView("home");
    toast("已从这个步骤继续");
  }

  function toggleMark(eventId, type) {
    const selected = dayForEvent(eventId);
    if (!selected) return;
    snapshot();
    const p = progress(selected.id);
    const list = p[type];
    const other = type === "done" ? p.skipped : p.done;
    const index = list.indexOf(eventId);
    if (index >= 0) list.splice(index, 1); else {
      list.push(eventId);
      const otherIndex = other.indexOf(eventId);
      if (otherIndex >= 0) other.splice(otherIndex, 1);
    }
    if (p.current === eventId) p.current = "";
    save();
    renderAll();
  }

  function completeAndAdvance(eventId) {
    const selected = dayForEvent(eventId);
    if (!selected) return;
    snapshot();
    const p = progress(selected.id);
    if (!p.done.includes(eventId)) p.done.push(eventId);
    p.skipped = p.skipped.filter(id => id !== eventId);
    const next = nextRemaining(byId(eventId));
    p.current = next?.id || "";
    save();
    renderAll();
    toast(next ? `下一步：${next.title}` : "当天步骤已完成");
  }

  function undo() {
    const previous = state.history.pop();
    if (!previous) return toast("没有可以撤销的操作");
    state.days = JSON.parse(previous);
    save();
    renderAll();
    showView(currentView);
    toast("已撤销");
  }

  function resetDay() {
    snapshot();
    state.days[selectedDayId] = { done: [], skipped: [], current: "" };
    save();
    renderAll();
    showView(currentView);
    toast("当天进度已重置");
  }

  function showDriver(item) {
    $("#driverLocal").textContent = item.localName || item.destination || item.title;
    $("#driverRomanized").textContent = item.romanized || item.title || "";
    $("#driverModal").classList.add("show");
  }

  function guideSection(title, items, ordered = false) {
    if (!array(items).length) return "";
    const tag = ordered ? "ol" : "ul";
    return `<section class="guide-section"><h3>${esc(title)}</h3><${tag}>${items.map(item => `<li>${esc(item)}</li>`).join("")}</${tag}></section>`;
  }

  function showGuide(event) {
    if (!event || !hasGuide(event)) return toast("这个步骤没有额外攻略");
    const guide = event.guide;
    $("#guideTag").textContent = guide.tag || "目的地攻略";
    $("#guideTitle").textContent = event.title;
    $("#guideLocal").textContent = [event.localName, event.romanized].filter(Boolean).join(" · ");
    $("#guideSummary").textContent = guide.summary || event.detail;
    $("#guideSections").innerHTML =
      branchHtml(event) +
      guideSection("到这里做什么", guide.do) +
      guideSection("重点看什么", guide.see) +
      guideSection("吃什么", guide.eat) +
      guideSection("现场路线", guide.route, true) +
      guideSection("注意事项", guide.tips) +
      (array(guide.sources).length ? `<section class="guide-section"><h3>来源</h3><div class="guide-sources">${guide.sources.map(source => `<a href="${esc(source.url)}" target="_blank" rel="noopener">${esc(source.label)}</a>`).join("")}</div></section>` : "");
    $("#guideActions").innerHTML = `<button class="action primary" data-guide-driver="${esc(event.id)}" type="button">给司机看</button><a class="action" href="${esc(googleUrl(event))}" target="_blank" rel="noopener">打开地图</a>`;
    $$("[data-guide-driver]", $("#guideModal")).forEach(button => button.addEventListener("click", () => showDriver(byId(button.dataset.guideDriver))));
    $$("[data-branch-driver]", $("#guideModal")).forEach(button => button.addEventListener("click", () => {
      const source = byId(button.dataset.branchDriver);
      showDriver(source.branches[Number(button.dataset.branchIndex)]);
    }));
    $("#guideModal").classList.add("show");
  }

  function bindEventActions(root) {
    $$("[data-complete]", root).forEach(button => button.addEventListener("click", () => completeAndAdvance(button.dataset.complete)));
    $$("[data-current]", root).forEach(button => button.addEventListener("click", () => setCurrent(button.dataset.current)));
    $$("[data-mark]", root).forEach(button => button.addEventListener("click", () => toggleMark(button.dataset.mark, "done")));
    $$("[data-skip]", root).forEach(button => button.addEventListener("click", () => toggleMark(button.dataset.skip, "skipped")));
    $$("[data-guide]", root).forEach(button => button.addEventListener("click", () => showGuide(byId(button.dataset.guide))));
    $$("[data-driver]", root).forEach(button => button.addEventListener("click", () => showDriver(byId(button.dataset.driver))));
    $$("[data-branch-driver]", root).forEach(button => button.addEventListener("click", () => {
      const event = byId(button.dataset.branchDriver);
      showDriver(event.branches[Number(button.dataset.branchIndex)]);
    }));
  }

  function renderAll() {
    document.title = `${DATA.meta.title} · Travel Companion`;
    renderTabs();
    renderHome();
    if (currentView === "timeline") renderTimeline();
    if (currentView === "guides") renderGuides();
    if (currentView === "trip") renderTrip();
    if (currentView === "more") renderMore();
  }

  $$("[data-nav]").forEach(button => button.addEventListener("click", () => showView(button.dataset.nav)));
  $$("[data-adjust]").forEach(button => button.addEventListener("click", () => {
    const advice = day().adjustments?.[button.dataset.adjust] || {
      title: "现场调整", detail: "保留下一个硬性时间，先删除可选活动。"
    };
    const notice = $("#adjustNotice");
    notice.innerHTML = `<b>${esc(advice.title)}</b><br>${esc(advice.detail)}`;
    notice.classList.add("show");
  }));
  $$("[data-close]").forEach(button => button.addEventListener("click", () => {
    document.getElementById(button.dataset.close).classList.remove("show");
  }));
  $$(".modal").forEach(modal => modal.addEventListener("click", event => {
    if (event.target === modal) modal.classList.remove("show");
  }));
  addEventListener("keydown", event => {
    if (event.key === "Escape") $$(".modal").forEach(modal => modal.classList.remove("show"));
  });

  const tick = () => {
    $("#clock").textContent = nowInfo().label;
    if (currentView === "home") renderHome();
  };
  renderAll();
  tick();
  setInterval(tick, 60000);

  const test = params.get("test");
  if (test === "timeline") { openEventId = day().events[0].id; showView("timeline"); }
  if (test === "guide") {
    const event = day().events.find(hasGuide);
    if (event) showGuide(event);
  }
  if (test === "driver") showDriver(day().events[0]);
})();
</script>
</body>
</html>
