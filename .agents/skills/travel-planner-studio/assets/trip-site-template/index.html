<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive, source-checked travel plan">
  <title>Trip plan</title>
  <style>
    :root {
      --ink: #17302e;
      --muted: #637370;
      --paper: #f6f3ed;
      --card: #fffdf9;
      --line: #d9ded9;
      --sea: #2b6f69;
      --sea-soft: #e2efec;
      --sun: #c77b42;
      --sun-soft: #f6e9dc;
      --red: #a6463b;
      --shadow: 0 18px 48px rgba(34, 55, 51, .10);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; line-height: 1.55; }
    a { color: inherit; }
    .wrap { width: min(1160px, calc(100% - 36px)); margin: 0 auto; }
    .hero { padding: 70px 0 46px; color: #fff; background: radial-gradient(circle at 85% 20%, rgba(255,255,255,.16), transparent 28%), linear-gradient(135deg, #17302e, #2b6f69); }
    .eyebrow { color: #d9ebe7; font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { max-width: 850px; margin: 10px 0 12px; font-family: Georgia, "Noto Serif SC", serif; font-size: clamp(2.25rem, 6vw, 4.5rem); line-height: 1.03; }
    .hero p { max-width: 760px; margin: 0; color: rgba(255,255,255,.78); font-size: 1.04rem; }
    .route-strip, .status-row, .map-actions, .links, .meta-row { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
    .route-strip { margin-top: 28px; }
    .route-stop, .tag, .pill { border-radius: 999px; font-size: .76rem; font-weight: 800; }
    .route-stop { padding: 8px 12px; background: rgba(255,255,255,.12); }
    .route-arrow { opacity: .55; }
    .status-row { margin-top: 16px; }
    .tag { display: inline-flex; padding: 6px 10px; background: var(--sea-soft); color: var(--sea); }
    .hero .tag { background: rgba(255,255,255,.14); color: #fff; }
    .tag.warn { background: var(--sun-soft); color: #815024; }
    .tag.hard { background: #f2dedb; color: var(--red); }
    nav { position: sticky; top: 0; z-index: 20; background: rgba(246,243,237,.94); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
    nav .wrap { display: flex; gap: 18px; overflow-x: auto; padding: 14px 0; }
    nav a { flex: 0 0 auto; color: var(--muted); font-size: .83rem; font-weight: 800; text-decoration: none; }
    main { padding: 26px 0 62px; }
    section { padding: 34px 0; scroll-margin-top: 58px; }
    .section-head { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 18px; }
    .section-head h2 { margin: 0; font-family: Georgia, "Noto Serif SC", serif; font-size: clamp(1.7rem, 4vw, 2.7rem); }
    .section-head p { margin: 5px 0 0; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .two { grid-template-columns: repeat(2, 1fr); }
    .card { padding: 21px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .card h3, .card h4 { margin: 0 0 7px; }
    .card p { margin: 0; color: var(--muted); }
    .day-shell { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, .65fr); gap: 16px; }
    .timeline { margin: 16px 0 0; padding: 0; list-style: none; }
    .timeline li { display: grid; grid-template-columns: 90px 18px 1fr; gap: 10px; min-height: 72px; }
    .timeline time { padding-top: 2px; color: var(--sea); font-weight: 900; font-size: .82rem; }
    .rail { position: relative; }
    .rail::after { content: ""; position: absolute; top: 16px; bottom: -5px; left: 8px; width: 2px; background: var(--line); }
    .timeline li:last-child .rail::after { display: none; }
    .dot { position: absolute; top: 5px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--sea); border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--sea); }
    .event { padding-bottom: 19px; }
    .event strong { display: block; }
    .event span { display: block; margin-top: 4px; color: var(--muted); font-size: .88rem; }
    .names { color: var(--sea) !important; font-size: .79rem !important; font-weight: 750; }
    iframe { width: 100%; height: 310px; margin: 14px 0; border: 0; border-radius: 16px; background: var(--sea-soft); }
    .button { display: inline-flex; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--sea); font-size: .78rem; font-weight: 850; text-decoration: none; cursor: pointer; }
    .button.primary { border-color: var(--sea); background: var(--sea); color: #fff; }
    .notice { margin-top: 14px; padding: 15px 17px; border-left: 4px solid var(--sun); border-radius: 0 14px 14px 0; background: var(--sun-soft); color: #6e431f; }
    .subhead { display: flex; justify-content: space-between; align-items: end; gap: 15px; margin: 24px 0 12px; }
    .subhead h3 { margin: 0; }
    .subhead small { color: var(--muted); }
    .pill { display: inline-flex; padding: 5px 8px; background: #eff1ed; color: var(--muted); }
    .score { color: var(--sun); font-weight: 900; }
    ul.compact { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: .86rem; }
    .feedback { padding: 25px; border-radius: 24px; background: var(--ink); color: #fff; }
    .feedback h2 { margin-top: 0; }
    .feedback-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .feedback label { display: grid; gap: 6px; color: rgba(255,255,255,.72); font-size: .82rem; }
    .feedback select { width: 100%; padding: 11px; border: 1px solid rgba(255,255,255,.2); border-radius: 11px; background: #244441; color: #fff; }
    .feedback .button { margin-top: 15px; }
    #copy-status { margin-left: 10px; color: rgba(255,255,255,.72); font-size: .82rem; }
    footer { padding: 20px 0 42px; color: var(--muted); font-size: .82rem; }
    .empty { color: var(--muted); font-style: italic; }

    @media (max-width: 880px) {
      .grid, .grid.two, .day-shell { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .wrap { width: min(100% - 24px, 1160px); }
      .hero { padding-top: 48px; }
      .feedback-grid { grid-template-columns: 1fr; }
      .timeline li { grid-template-columns: 76px 16px 1fr; gap: 7px; }
      .section-head, .subhead { align-items: start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="./trip-data.js"></script>
  <script>
    (() => {
      const plan = globalThis.TRIP_PLAN;
      if (!plan) {
        document.getElementById("app").innerHTML = "<p>Missing trip-data.js</p>";
        return;
      }

      const esc = (value = "") => String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
      const url = value => /^https?:\/\//i.test(value || "") ? esc(value) : "#";
      const tagClass = value => /hard|confirmed|verified/i.test(value || "") ? "hard" : /estimate|needs|draft/i.test(value || "") ? "warn" : "";
      const tags = values => values.filter(Boolean).map(value => `<span class="pill">${esc(value)}</span>`).join("");
      const mapEmbed = query => `https://www.google.com/maps?q=${encodeURIComponent(query || plan.meta.destination)}&output=embed`;
      const nav = [
        ["overview", "总览"],
        ...plan.days.map(day => [day.id, `${day.date} ${day.place}`]),
        ["transport", "交通指南"],
        ["actions", "待办事项"],
        ["feedback", "我的选择"],
        ["sources", "信息来源"]
      ];

      const stayCards = plan.stays.length ? plan.stays.map(stay => `
        <article class="card">
          <div class="meta-row"><span class="tag ${tagClass(stay.status)}">${esc(stay.status)}</span><span class="pill">${esc(stay.date)}</span></div>
          <h3>${esc(stay.name)}</h3>
          ${stay.localName ? `<p class="names">${esc(stay.localName)}</p>` : ""}
          <p>${esc(stay.detail)}</p>
          ${stay.mapUrl ? `<div class="links"><a class="button" target="_blank" rel="noopener" href="${url(stay.mapUrl)}">Map</a></div>` : ""}
        </article>`).join("") : `<p class="empty">No active stays added.</p>`;

      const daySections = plan.days.map(day => {
        const timeline = day.timeline.map(item => `
          <li>
            <time>${esc(item.time)}</time>
            <span class="rail"><span class="dot"></span></span>
            <div class="event">
              <strong>${esc(item.title)} ${item.hardGate ? `<span class="tag hard">硬性时间点</span>` : ""}</strong>
              ${(item.english || item.local) ? `<span class="names">${esc(item.english)}${item.english && item.local ? " ｜ " : ""}${esc(item.local)}</span>` : ""}
              <span>${esc(item.detail)}</span>
              ${item.status ? `<span class="tag ${tagClass(item.status)}">${esc(item.status)}</span>` : ""}
            </div>
          </li>`).join("");
        const mapActions = (day.map?.actions || []).map(action => `<a class="button" target="_blank" rel="noopener" href="${url(action.url)}">${esc(action.label)}</a>`).join("");
        const alternatives = day.alternatives.length ? `
          <div class="subhead"><h3>备选方案</h3><small>仅在触发条件出现时启用</small></div>
          <div class="grid">${day.alternatives.map(option => `
            <article class="card">
              <span class="tag warn">${esc(option.tag)}</span>
              <h4>${esc(option.name)}</h4>
              <p>${esc(option.detail)}</p>
              <ul class="compact">${(option.tradeoffs || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
            </article>`).join("")}</div>` : "";
        const dining = day.dining.length ? `
          <div class="subhead"><h3>餐厅与用餐</h3><small>评分与营业信息必须注明核验日期</small></div>
          <div class="grid">${day.dining.map(place => `
            <article class="card">
              <div class="meta-row"><span class="tag">${esc(place.meal)}</span><span class="score">${esc(place.rating)}</span></div>
              <h4>${esc(place.name)}</h4>
              ${place.localName ? `<p class="names">${esc(place.localName)}</p>` : ""}
              <p>${esc(place.detail)}</p>
              <div class="meta-row">${tags([place.price, place.booking, `${place.ratingSource} · ${place.checkedOn}`])}</div>
              <div class="links">
                ${place.mapUrl ? `<a class="button" target="_blank" rel="noopener" href="${url(place.mapUrl)}">Map</a>` : ""}
                ${place.sourceUrl ? `<a class="button" target="_blank" rel="noopener" href="${url(place.sourceUrl)}">Source</a>` : ""}
              </div>
            </article>`).join("")}</div>` : "";
        return `
          <section id="${esc(day.id)}">
            <div class="section-head">
              <div><h2>${esc(day.date)}｜${esc(day.place)}</h2><p>${esc(day.theme)} — ${esc(day.summary)}</p></div>
              <span class="tag ${tagClass(day.status)}">${esc(day.status)}</span>
            </div>
            <div class="day-shell">
              <article class="card">
                <h3>推荐主线</h3>
                <ol class="timeline">${timeline}</ol>
              </article>
              <aside class="card">
                <h3>当天地图</h3>
                <p>${esc(day.map?.caption || "")}</p>
                <iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="${esc(day.place)} map" src="${mapEmbed(day.map?.query)}"></iframe>
                <div class="map-actions">${mapActions}</div>
              </aside>
            </div>
            ${(day.notices || []).map(note => `<div class="notice">${esc(note)}</div>`).join("")}
            ${alternatives}
            ${dining}
          </section>`;
      }).join("");

      const transportCards = plan.transportGuide.length ? plan.transportGuide.map(item => `
        <article class="card">
          <div class="meta-row"><span class="tag">${esc(item.date)}</span><span class="pill">${esc(item.time)}</span></div>
          <h3>${esc(item.label)}</h3>
          <p class="names">${esc(item.service)}${item.english ? ` ｜ ${esc(item.english)}` : ""}${item.local ? ` ｜ ${esc(item.local)}` : ""}</p>
          <p><strong>${esc(item.origin)}</strong> → <strong>${esc(item.destination)}</strong></p>
          <div class="meta-row">${tags([item.direction, item.reservation])}</div>
          <ul class="compact">${(item.instructions || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
          ${item.sourceUrl ? `<a class="button" target="_blank" rel="noopener" href="${url(item.sourceUrl)}">官方来源</a>` : ""}
        </article>`).join("") : `<p class="empty">No critical transport segments added.</p>`;

      const actionRows = plan.actionItems.length ? plan.actionItems.map(item => `
        <article class="card">
          <div class="meta-row"><span class="tag hard">优先级 ${esc(item.priority)}</span><span class="pill">${esc(item.status)}</span></div>
          <h3>${esc(item.action)}</h3>
          <p>${esc(item.reason)}</p>
          <div class="meta-row"><span class="pill">${esc(item.deadline)}</span></div>
        </article>`).join("") : `<p class="empty">No open actions.</p>`;

      const feedbackFields = plan.feedback.map(item => `
        <label>${esc(item.label)}
          <select data-feedback="${esc(item.key)}">
            ${item.options.map(option => `<option${option === item.default ? " selected" : ""}>${esc(option)}</option>`).join("")}
          </select>
        </label>`).join("");
      const sourceLinks = plan.sources.map(source => `<a class="button" target="_blank" rel="noopener" href="${url(source.url)}">${esc(source.label)}</a>`).join("");

      document.title = plan.meta.title;
      document.getElementById("app").innerHTML = `
        <header class="hero">
          <div class="wrap">
            <div class="eyebrow">${esc(plan.meta.eyebrow)}</div>
            <h1>${esc(plan.meta.title)}</h1>
            <p>${esc(plan.meta.subtitle)}</p>
            <div class="route-strip">${plan.routeStops.map((stop, index) => `${index ? `<span class="route-arrow">→</span>` : ""}<span class="route-stop">${esc(stop)}</span>`).join("")}</div>
            <div class="status-row"><span class="tag">${esc(plan.meta.status)}</span><span class="tag">Checked ${esc(plan.meta.checkedOn)}</span></div>
          </div>
        </header>
        <nav><div class="wrap">${nav.map(([id, label]) => `<a href="#${esc(id)}">${esc(label)}</a>`).join("")}</div></nav>
        <main class="wrap">
          <section id="overview">
            <div class="section-head"><div><h2>行程总览</h2><p>${esc(plan.meta.destination)} · ${esc(plan.meta.dates)}</p></div></div>
            <div class="grid">${stayCards}</div>
          </section>
          ${daySections}
          <section id="transport">
            <div class="section-head"><div><h2>各段交通怎么搭</h2><p>名称、方向显示、预约状态与现场执行步骤。</p></div></div>
            <div class="grid two">${transportCards}</div>
          </section>
          <section id="actions">
            <div class="section-head"><div><h2>预订与待确认事项</h2><p>只保留仍然需要处理的事项。</p></div></div>
            <div class="grid">${actionRows}</div>
          </section>
          ${plan.feedback.length ? `
          <section id="feedback" class="feedback">
            <h2>集中确认我的选择</h2>
            <p>所有非阻塞问题集中在这里；选择只保存在当前浏览器。</p>
            <div class="feedback-grid">${feedbackFields}</div>
            <button class="button primary" id="copy-plan" type="button">复制我的选择</button><span id="copy-status"></span>
          </section>` : ""}
          <section id="sources">
            <div class="section-head"><div><h2>信息来源</h2><p>预订前重新打开当前官方页面核对。</p></div></div>
            <div class="links">${sourceLinks}</div>
          </section>
        </main>
        <footer class="wrap">${esc(plan.meta.footer)}</footer>`;

      if (plan.feedback.length) {
        const storageKey = `trip-plan-${plan.meta.slug}`;
        let saved = {};
        try { saved = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch (_) {}
        document.querySelectorAll("[data-feedback]").forEach(select => {
          if (saved[select.dataset.feedback]) select.value = saved[select.dataset.feedback];
          select.addEventListener("change", () => {
            saved[select.dataset.feedback] = select.value;
            localStorage.setItem(storageKey, JSON.stringify(saved));
          });
        });
        document.getElementById("copy-plan").addEventListener("click", async () => {
          const lines = ["我的旅行计划选择：", ...[...document.querySelectorAll("[data-feedback]")].map(select => {
            const field = plan.feedback.find(item => item.key === select.dataset.feedback);
            return `${field.label}: ${select.value}`;
          })];
          try {
            await navigator.clipboard.writeText(lines.join("\n"));
            document.getElementById("copy-status").textContent = "已复制";
          } catch (_) {
            document.getElementById("copy-status").textContent = lines.join(" | ");
          }
        });
      }
    })();
  </script>
</body>
</html>
