name: Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify tag and release files
        shell: bash
        run: |
          version="$(cat .agents/skills/travel-planner-studio/VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi
          node .agents/skills/travel-planner-studio/scripts/validate-release.mjs \
            .agents/skills/travel-planner-studio

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "Travel Planner Studio $GITHUB_REF_NAME"
          --generate-notes

